name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.12.19"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked mypy --strict src

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked pytest

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: |
          echo "Commits in history: $(git rev-list --all --count)"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - name: Export the locked dependency set
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt"
          echo "Locked packages: $(grep -cE '^[A-Za-z0-9]' "$RUNNER_TEMP/requirements.txt")"
      - name: Audit for known vulnerabilities
        run: |
          uv run --locked pip-audit --strict --require-hashes --disable-pip \
            --requirement "$RUNNER_TEMP/requirements.txt"

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: vrm-alert-relay:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-scanners
      - name: Lint Dockerfile
        run: '"$RUNNER_TEMP/hadolint" Dockerfile'
      - name: Install Docker Compose
        env:
          COMPOSE_VERSION: "2.39.4"
          COMPOSE_SHA256: 7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/docker-compose" \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $RUNNER_TEMP/docker-compose" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/docker-compose"
          "$RUNNER_TEMP/docker-compose" version
      - name: Validate Compose example
        run: |
          compose="$RUNNER_TEMP/docker-compose"
          check=(python3 .github/scripts/check_compose_hardening.py --root "$PWD")
          expected=.github/compose-hardening.expected.json

          # The example as shipped must match the expected file exactly, and
          # keep every invariant.
          "$compose" -f compose.example.yaml config --quiet
          "$compose" -f compose.example.yaml config --format json | "${check[@]}" --expected "$expected"

          # Self-test: every weakened copy must be rejected, for the reason its
          # file names. Where that reason is an invariant, it must still be
          # rejected after the expected file is carelessly regenerated from it.
          for case in .github/compose-selftest/*.yaml; do
            name="$(basename "$case" .yaml)"
            reason="$(sed -n 's/^# expect: //p' "$case")"
            [[ -n "$reason" ]] || { echo "::error::self-test ${name} names no expected reason"; exit 1; }
            rendered="$RUNNER_TEMP/${name}.json"
            "$compose" -f compose.example.yaml -f "$case" config --format json > "$rendered"
            modes=(golden)
            if [[ "$reason" == invariant* ]]; then
              "${check[@]}" --expected "$RUNNER_TEMP/${name}.expected.json" --update < "$rendered" > /dev/null
              modes+=(regenerated)
            fi
            for mode in "${modes[@]}"; do
              file="$expected"
              [[ "$mode" == regenerated ]] && file="$RUNNER_TEMP/${name}.expected.json"
              if output="$("${check[@]}" --expected "$file" < "$rendered" 2>&1)"; then
                echo "::error::self-test ${name} (${mode}): the weakened copy was accepted"
                exit 1
              fi
              if ! grep -qF -- "$reason" <<< "$output"; then
                echo "::error::self-test ${name} (${mode}): rejected for the wrong reason: ${output}"
                exit 1
              fi
              echo "Self-test ${name} (${mode}) rejected as expected: $(grep -F -- "$reason" <<< "$output")"
            done
          done
      - name: Build image
        run: |
          log="$RUNNER_TEMP/build.log"
          docker build --pull --progress=plain --tag "$IMAGE" . 2>&1 | tee "$log"

          # The runtime root filesystem was installed in this build, not taken from a
          # cache, and no package script failed (scripts are skipped deliberately and
          # ldconfig runs from the builder; see the Dockerfile).
          grep -E 'Installing python-3\.13-base' "$log"
          grep -E '^#[0-9]+ [0-9.]+ \+ ldconfig -r /rootfs' "$log"
          if grep -F 'script exited with error' "$log"; then
            echo "::error::a package script failed during the image build"
            exit 1
          fi
          echo "Build log: no 'script exited with error'"
      - name: Smoke test hardened runtime
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Image config user: ${user}"
          uid="${user%%:*}"
          case "$uid" in
            '' | 0 | root | *[!0-9]*)
              echo "::error::image must run as a non-zero numeric UID, got '${user}'"
              exit 1
              ;;
          esac

          hardened=(docker run --rm --read-only --cap-drop ALL
                    --security-opt no-new-privileges --network none)

          version="$("${hardened[@]}" "$IMAGE" --version)"
          echo "Version output: ${version}"
          [[ "$version" =~ ^vrm-alert-relay\ [0-9]+\.[0-9]+ ]]

          ids="$("${hardened[@]}" --entrypoint /opt/venv/bin/python "$IMAGE" \
                 -c 'import os; print(os.geteuid(), os.getegid())')"
          echo "Effective UID and GID: ${ids}"
          [[ "${ids%% *}" != 0 ]]

          cmd="$(docker image inspect --format '{{json .Config.Cmd}}' "$IMAGE")"
          echo "Image Cmd: ${cmd}"
          [[ "$cmd" == '["run"]' ]]

          workdir="$(docker image inspect --format '{{.Config.WorkingDir}}' "$IMAGE")"
          echo "Image WorkingDir: ${workdir}"
          [[ "$workdir" == /home/nonroot ]]

          # Runtime contract, checked with the image's own Python (it has no shell).
          "${hardened[@]}" --volume "$PWD/.github/scripts:/smoke:ro" \
            --entrypoint /opt/venv/bin/python "$IMAGE" /smoke/check_runtime_image.py

          stat_state='import os, stat; s = os.stat("/var/lib/vrm-alert-relay"); print(s.st_uid, s.st_gid, oct(stat.S_IMODE(s.st_mode)))'
          perms="$("${hardened[@]}" --entrypoint /opt/venv/bin/python "$IMAGE" -c "$stat_state")"
          echo "Image state directory: ${perms}"
          [[ "$perms" == "65532 65532 0o700" ]]

          # A named volume, initialised from the image, holds the state across two
          # runs. The VRM token is fictitious and the network is off, so every poll
          # fails and nothing is sent; the second run reports monitoring degraded
          # only because the first run's failed poll was stored.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          printf 'fictitious-smoke-test-value\n' > "$smoke/vrm_token"
          chmod 0644 "$smoke/vrm_token"
          docker volume create vrm-smoke-state
          state=(--volume vrm-smoke-state:/var/lib/vrm-alert-relay)
          perms="$("${hardened[@]}" "${state[@]}" --entrypoint /opt/venv/bin/python "$IMAGE" -c "$stat_state")"
          echo "Volume state directory: ${perms}"
          [[ "$perms" == "65532 65532 0o700" ]]

          relay=("${hardened[@]}" "${state[@]}"
                 --volume "$PWD/examples/config.example.yaml:/etc/vrm-alert-relay/config.yaml:ro"
                 --volume "$smoke/vrm_token:/run/secrets/vrm_token:ro"
                 "$IMAGE" run --once)
          for run in 1 2; do
            log="$("${relay[@]}")"
            echo "Run ${run} log:"
            echo "$log"
            python3 - "$run" "$log" <<'PY'
          import json, sys
          run = int(sys.argv[1])
          records = [json.loads(line) for line in sys.argv[2].splitlines()]
          events = [r.get("event") for r in records]
          started = next(r for r in records if r.get("event") == "service.started")
          assert started["dry_run"] is True, started
          assert "relay.cycle" in events, events
          assert events[-1] == "service.stopped", events
          for bad in ("state.persistence_failed", "state.directory_permissive", "delivery.history_unknown"):
              assert bad not in events, (bad, events)
          degraded = events.count("monitoring.degraded")
          assert degraded == (0 if run == 1 else 1), (run, events)
          PY
          done
          files="$("${hardened[@]}" "${state[@]}" --entrypoint /opt/venv/bin/python "$IMAGE" \
                   -c 'import os; print(" ".join(sorted(os.listdir("/var/lib/vrm-alert-relay"))))')"
          echo "State files: ${files}"
          [[ " $files " == *" relay-state.sqlite3 "* && " $files " == *" relay-state.lock "* ]]
          docker volume rm vrm-smoke-state
      - name: Smoke test TLS verification
        run: |
          # A throwaway CA and server certificates, a test server running from the
          # image itself, and the relay's own client, all on an internal network with
          # no route to the internet.
          pki="$RUNNER_TEMP/tls-pki"
          .github/scripts/make_tls_smoke_pki.sh "$pki" tls.example.test
          docker network create --internal vrm-tls-smoke
          hardened=(docker run --rm --read-only --cap-drop ALL
                    --security-opt no-new-privileges --network vrm-tls-smoke
                    --volume "$PWD/.github/scripts:/smoke:ro" --volume "$pki:/certs:ro"
                    --entrypoint /opt/venv/bin/python)
          "${hardened[@]}" --detach --name vrm-tls-server \
            --network-alias tls.example.test --network-alias wrong.example.test \
            "$IMAGE" /smoke/tls_smoke_server.py
          status=0
          "${hardened[@]}" "$IMAGE" /smoke/tls_smoke_client.py || status=$?
          echo "Server log:"
          docker logs vrm-tls-server
          docker rm --force vrm-tls-server
          docker network rm vrm-tls-smoke
          exit "$status"
      - name: Generate SBOM
        run: |
          "$RUNNER_TEMP/trivy" image --no-progress --format cyclonedx \
            --output sbom.cdx.json "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
      - uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE }}
