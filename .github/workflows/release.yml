name: Release

# Publishes a signed multi-platform image and a GitHub Release when a version
# tag is pushed. RELEASING.md describes the procedure; docs/deploy-docker.md
# describes how to verify the result.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REPOSITORY: ghcr.io/mcflycodes/vrm-alert-relay
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image-tag: ${{ steps.version.outputs.image-tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against the project version
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          # vMAJOR.MINOR.PATCH with an optional -alpha.N, -beta.N or -rc.N suffix.
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::tag '${tag}' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N"
            exit 1
          fi
          release="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          # The tag uses SemVer pre-release syntax; pyproject.toml must hold the
          # same version in canonical PEP 440 form (v0.1.0-rc.1 is 0.1.0rc1).
          case "${BASH_REMATCH[5]}" in
            '') version="$release" ;;
            alpha) version="${release}a${BASH_REMATCH[6]}" ;;
            beta) version="${release}b${BASH_REMATCH[6]}" ;;
            rc) version="${release}rc${BASH_REMATCH[6]}" ;;
          esac
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$project" != "$version" ]]; then
            echo "::error::tag ${tag} needs version ${version} in pyproject.toml, which has ${project}"
            exit 1
          fi

          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag ${tag} points to ${commit}, which is not on main"
            exit 1
          fi

          prerelease=false
          [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
          echo "Tag ${tag}: version ${version}, image tag ${tag#v}, pre-release ${prerelease}, commit ${commit}"
          {
            echo "tag=${tag}"
            echo "image-tag=${tag#v}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the version tag to GHCR
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
      amd64-digest: ${{ steps.verify.outputs.amd64-digest }}
      arm64-digest: ${{ steps.verify.outputs.arm64-digest }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-scanners
      - name: Lint Dockerfile
        run: '"$RUNNER_TEMP/hadolint" Dockerfile'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      # The image is built once per platform for scanning, then again for all
      # platforms to push. The commit time fixes every timestamp, so the second
      # build comes from the build cache and must produce the same image
      # configuration; the verify step below checks that it did.
      - name: Build each platform
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" >> "$GITHUB_ENV"
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            arch="${platform#linux/}"
            docker buildx build --pull --platform "$platform" \
              --provenance=false --sbom=false \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --load --tag "vrm-alert-relay:release-${arch}" .
            docker image inspect --format '{{.Id}}' "vrm-alert-relay:release-${arch}" \
              > "$RUNNER_TEMP/config-${arch}.txt"
            echo "${platform} image configuration: $(cat "$RUNNER_TEMP/config-${arch}.txt")"
          done
      - name: Smoke test each platform
        run: |
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            image="vrm-alert-relay:release-${platform#linux/}"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            uid="${user%%:*}"
            case "$uid" in
              '' | 0 | root | *[!0-9]*)
                echo "::error::${platform} image must run as a non-zero numeric UID, got '${user}'"
                exit 1
                ;;
            esac
            output="$(docker run --rm --platform "$platform" --read-only --cap-drop ALL \
              --security-opt no-new-privileges --network none "$image" --version)"
            echo "${platform}: ${output} (user ${user})"
            if [[ "$output" != "vrm-alert-relay ${VERSION}" ]]; then
              echo "::error::${platform} image reports '${output}', expected 'vrm-alert-relay ${VERSION}'"
              exit 1
            fi
          done
      - uses: ./.github/actions/scan-image
        with:
          image: vrm-alert-relay:release-amd64
      - uses: ./.github/actions/scan-image
        with:
          image: vrm-alert-relay:release-arm64
      - name: Generate SBOMs
        run: |
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            arch="${platform#linux/}"
            "$RUNNER_TEMP/trivy" image --no-progress --format cyclonedx \
              --output "sbom-linux-${arch}.cdx.json" "vrm-alert-relay:release-${arch}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom-linux-*.cdx.json
          if-no-files-found: error
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Only the exact version tag is pushed here; "latest" moves after signing.
      - name: Push image
        run: |
          docker buildx build --platform "$PLATFORMS" \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --metadata-file "$RUNNER_TEMP/push.json" \
            --push --tag "${REPOSITORY}:${IMAGE_TAG}" .
      - name: Verify the pushed image is the scanned image
        id: verify
        run: |
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/push.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest in the build metadata"; exit 1; }
          index="$(docker buildx imagetools inspect --raw "${REPOSITORY}@${digest}")"
          count="$(jq '.manifests | length' <<< "$index")"
          IFS=, read -ra platforms <<< "$PLATFORMS"
          if [[ "$count" != "${#platforms[@]}" ]]; then
            echo "::error::the pushed index has ${count} manifests, expected ${#platforms[@]}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${REPOSITORY}:${IMAGE_TAG} is ${digest}"
          for platform in "${platforms[@]}"; do
            arch="${platform#linux/}"
            manifest="$(jq -r --arg arch "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else empty end' \
              <<< "$index")"
            [[ -n "$manifest" ]] || { echo "::error::no single ${platform} manifest in the pushed index"; exit 1; }
            pushed="$(docker buildx imagetools inspect --raw "${REPOSITORY}@${manifest}" | jq -r '.config.digest')"
            scanned="$(cat "$RUNNER_TEMP/config-${arch}.txt")"
            echo "${platform}: manifest ${manifest}, pushed configuration ${pushed}, scanned ${scanned}"
            if [[ "$pushed" != "$scanned" ]]; then
              echo "::error::the pushed ${platform} image differs from the scanned one; it will not be signed"
              exit 1
            fi
            echo "${arch}-digest=${manifest}" >> "$GITHUB_OUTPUT"
          done

  sign:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write # store signatures and attestations, move latest
      id-token: write # keyless signing with the job's OIDC token
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      AMD64_DIGEST: ${{ needs.build.outputs.amd64-digest }}
      ARM64_DIGEST: ${{ needs.build.outputs.arm64-digest }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Keyless: the certificate binds the signature to this workflow at this
      # tag through the job's GitHub OIDC token. No key is stored anywhere.
      - name: Sign the image
        run: cosign sign --yes --recursive "${REPOSITORY}@${DIGEST}"
      - name: Attest each platform's SBOM
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom/sbom-linux-amd64.cdx.json \
            "${REPOSITORY}@${AMD64_DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom/sbom-linux-arm64.cdx.json \
            "${REPOSITORY}@${ARM64_DIGEST}"
      - name: Verify the signature and attestations
        run: |
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          echo "Expected signer: ${identity}"
          verify=(--certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER")
          for ref in "$DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            cosign verify "${verify[@]}" "${REPOSITORY}@${ref}" > /dev/null
          done
          for ref in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            cosign verify-attestation --type cyclonedx "${verify[@]}" "${REPOSITORY}@${ref}" > /dev/null
          done
          echo "Signature and SBOM attestations verified"
      - name: Tag latest
        if: env.PRERELEASE == 'false'
        run: |
          docker buildx imagetools create --tag "${REPOSITORY}:latest" "${REPOSITORY}@${DIGEST}"
          latest="sha256:$(docker buildx imagetools inspect --raw "${REPOSITORY}:latest" | sha256sum | cut -d' ' -f1)"
          if [[ "$latest" != "$DIGEST" ]]; then
            echo "::error::${REPOSITORY}:latest is ${latest}, expected ${DIGEST}"
            exit 1
          fi
          echo "${REPOSITORY}:latest is ${DIGEST}"

  release:
    needs: [prepare, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom
      - name: Write release notes
        run: |
          docs="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/docs/deploy-docker.md#verifying-a-release-image"
          {
            echo "VRM Alert Relay is an unofficial, independent project. It is not affiliated with, sponsored by, or endorsed by Victron Energy."
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "This is a pre-release for testing. It is not tagged \`latest\`."
              echo
            fi
            echo "## Container image"
            echo
            echo "Platforms: \`${PLATFORMS}\`"
            echo
            echo '```'
            echo "${REPOSITORY}:${IMAGE_TAG}"
            echo "${REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "The image is signed with Sigstore cosign (keyless, GitHub Actions OIDC), and each platform's CycloneDX SBOM is attached to the image as a signed attestation and to this release. To verify the signature:"
            echo
            echo '```sh'
            echo "cosign verify \\"
            echo "  --certificate-identity '${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "Verifying the SBOM attestations is described in [docs/deploy-docker.md](${docs})."
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest)
          [[ "$PRERELEASE" == true ]] && flags=(--prerelease --latest=false)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${flags[@]}" \
            sbom/sbom-linux-amd64.cdx.json sbom/sbom-linux-arm64.cdx.json
