name: Release

# Publishes a signed multi-platform image and a GitHub Release when a version
# tag is pushed. RELEASING.md describes the procedure and what each failure
# leaves behind; docs/deploy-docker.md describes how to verify the result.
#
# The image is built once, into an OCI layout. The scans, SBOMs and smoke tests
# use that layout, and exactly those objects are published, first by digest
# only. Tags are applied only once the digest is signed and its SBOMs attested,
# and "latest" moves last.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

# One release at a time across the repository, so two releases cannot race on
# "latest". A run waits for the one in progress. GitHub keeps only one waiting
# run per group, so a third tag pushed meanwhile cancels the waiting run before
# it starts (RELEASING.md). "queue: max" would keep them all, but actionlint
# does not accept that key yet.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REPOSITORY: ghcr.io/mcflycodes/vrm-alert-relay
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image-tag: ${{ steps.version.outputs.image-tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against the project version
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          # vMAJOR.MINOR.PATCH with an optional -alpha.N, -beta.N or -rc.N suffix.
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::tag '${tag}' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N"
            exit 1
          fi
          release="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          # The tag uses SemVer pre-release syntax; pyproject.toml must hold the
          # same version in canonical PEP 440 form (v0.1.0-rc.1 is 0.1.0rc1).
          case "${BASH_REMATCH[5]}" in
            '') version="$release" ;;
            alpha) version="${release}a${BASH_REMATCH[6]}" ;;
            beta) version="${release}b${BASH_REMATCH[6]}" ;;
            rc) version="${release}rc${BASH_REMATCH[6]}" ;;
          esac
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$project" != "$version" ]]; then
            echo "::error::tag ${tag} needs version ${version} in pyproject.toml, which has ${project}"
            exit 1
          fi

          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag ${tag} points to ${commit}, which is not on main"
            exit 1
          fi

          prerelease=false
          [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
          echo "Tag ${tag}: version ${version}, image tag ${tag#v}, pre-release ${prerelease}, commit ${commit}"
          {
            echo "tag=${tag}"
            echo "image-tag=${tag#v}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  # Builds every platform once into an OCI layout and tests and scans that
  # layout. Nothing leaves the runner except as workflow artifacts.
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
      amd64-digest: ${{ steps.layout.outputs.amd64-digest }}
      arm64-digest: ${{ steps.layout.outputs.arm64-digest }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-scanners
      - name: Lint Dockerfile
        run: '"$RUNNER_TEMP/hadolint" Dockerfile'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build all platforms into an OCI layout
        run: |
          log="$RUNNER_TEMP/build.log"
          docker buildx build --pull --progress=plain --platform "$PLATFORMS" \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --output "type=oci,dest=${RUNNER_TEMP}/image.oci.tar" . 2>&1 | tee "$log"

          # As in CI: each platform's runtime root filesystem was installed in this
          # build, and no package script failed (see the Dockerfile).
          IFS=, read -ra platforms <<< "$PLATFORMS"
          installs="$(grep -cE 'Installing python-3\.13-base' "$log" || true)"
          ldconfigs="$(grep -cE '^#[0-9]+ [0-9.]+ \+ ldconfig -r /rootfs' "$log" || true)"
          echo "python-3.13-base installs: ${installs}; ldconfig runs: ${ldconfigs}"
          if (( installs < 2 * ${#platforms[@]} || ldconfigs < ${#platforms[@]} )); then
            echo "::error::the build log does not show every platform's root filesystem being installed"
            exit 1
          fi
          if grep -F 'script exited with error' "$log"; then
            echo "::error::a package script failed during the image build"
            exit 1
          fi
      - name: Read the layout
        id: layout
        run: |
          layout="$RUNNER_TEMP/oci/layout"
          mkdir -p "$layout"
          tar -xf "$RUNNER_TEMP/image.oci.tar" -C "$layout"
          digest="$(jq -r 'if (.manifests | length) == 1 and .manifests[0].mediaType == "application/vnd.oci.image.index.v1+json" then .manifests[0].digest else empty end' "$layout/index.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the layout does not hold exactly one image index"; exit 1; }
          index="$layout/blobs/sha256/${digest#sha256:}"
          echo "${digest#sha256:}  ${index}" | sha256sum --check --strict
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Image index: ${digest}"

          IFS=, read -ra platforms <<< "$PLATFORMS"
          if [[ "$(jq '.manifests | length' "$index")" != "${#platforms[@]}" ]]; then
            echo "::error::the image index does not hold exactly one manifest per platform"
            exit 1
          fi
          # A one-image view of the layout per platform, sharing its blobs, for the
          # smoke tests, scans and SBOMs.
          for platform in "${platforms[@]}"; do
            arch="${platform#linux/}"
            descriptor="$(jq -c --arg arch "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0] else empty end' \
              "$index")"
            [[ -n "$descriptor" ]] || { echo "::error::no single ${platform} manifest in the image index"; exit 1; }
            manifest="$(jq -r .digest <<< "$descriptor")"
            echo "${manifest#sha256:}  ${layout}/blobs/sha256/${manifest#sha256:}" | sha256sum --check --strict
            view="$RUNNER_TEMP/oci/view-${arch}"
            mkdir -p "$view"
            cp "$layout/oci-layout" "$view/"
            ln -s ../layout/blobs "$view/blobs"
            jq -n --argjson d "$descriptor" \
              '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: [$d]}' \
              > "$view/index.json"
            echo "${arch}-digest=${manifest}" >> "$GITHUB_OUTPUT"
            echo "${platform}: ${manifest}"
          done
      - name: Load each platform into Docker
        run: |
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            arch="${platform#linux/}"
            view="$RUNNER_TEMP/oci/view-${arch}"
            manifest="$(jq -r '.manifests[0].digest' "$view/index.json")"
            config="$(jq -r .config.digest "$view/blobs/sha256/${manifest#sha256:}")"
            # Docker's classic image store loads only docker-archive tarballs, so
            # the view gets a manifest.json naming the same blobs.
            jq -n --arg arch "$arch" --slurpfile m "$view/blobs/sha256/${manifest#sha256:}" \
              '[{Config: ("blobs/sha256/" + ($m[0].config.digest | ltrimstr("sha256:"))),
                 RepoTags: ["vrm-alert-relay:release-\($arch)"],
                 Layers: [$m[0].layers[].digest | "blobs/sha256/" + ltrimstr("sha256:")]}]' \
              > "$RUNNER_TEMP/oci/manifest-${arch}.json"
            tar -chf "$RUNNER_TEMP/oci/${arch}.tar" -C "$view" oci-layout index.json blobs \
              --transform "s|^manifest-${arch}.json|manifest.json|" -C "$RUNNER_TEMP/oci" "manifest-${arch}.json"
            docker load --input "$RUNNER_TEMP/oci/${arch}.tar"
            # Docker's image ID is the configuration digest, so this is the image
            # from the layout.
            loaded="$(docker image inspect --format '{{.Id}}' "vrm-alert-relay:release-${arch}")"
            if [[ "$loaded" != "$config" ]]; then
              echo "::error::${platform}: Docker loaded ${loaded}, the layout holds ${config}"
              exit 1
            fi
            echo "${platform}: loaded configuration ${config}"
          done
      - name: Smoke test each platform
        run: |
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            image="vrm-alert-relay:release-${platform#linux/}"
            echo "::group::${platform}"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            uid="${user%%:*}"
            case "$uid" in
              '' | 0 | root | *[!0-9]*)
                echo "::error::${platform} image must run as a non-zero numeric UID, got '${user}'"
                exit 1
                ;;
            esac
            cmd="$(docker image inspect --format '{{json .Config.Cmd}}' "$image")"
            workdir="$(docker image inspect --format '{{.Config.WorkingDir}}' "$image")"
            echo "User ${user}, Cmd ${cmd}, WorkingDir ${workdir}"
            [[ "$cmd" == '["run"]' && "$workdir" == /home/nonroot ]]

            hardened=(docker run --rm --platform "$platform" --read-only --cap-drop ALL
                      --security-opt no-new-privileges --network none)
            output="$("${hardened[@]}" "$image" --version)"
            echo "Version output: ${output}"
            if [[ "$output" != "vrm-alert-relay ${VERSION}" ]]; then
              echo "::error::${platform} image reports '${output}', expected 'vrm-alert-relay ${VERSION}'"
              exit 1
            fi
            "${hardened[@]}" --volume "$PWD/.github/scripts:/smoke:ro" \
              --entrypoint /opt/venv/bin/python "$image" /smoke/check_runtime_image.py
            perms="$("${hardened[@]}" --entrypoint /opt/venv/bin/python "$image" -c \
              'import os, stat; s = os.stat("/var/lib/vrm-alert-relay"); print(s.st_uid, s.st_gid, oct(stat.S_IMODE(s.st_mode)))')"
            echo "State directory: ${perms}"
            [[ "$perms" == "65532 65532 0o700" ]]
            echo "::endgroup::"
          done
      - name: Smoke test TLS verification on each platform
        run: |
          pki="$RUNNER_TEMP/tls-pki"
          .github/scripts/make_tls_smoke_pki.sh "$pki" tls.example.test
          docker network create --internal vrm-tls-smoke
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            image="vrm-alert-relay:release-${platform#linux/}"
            echo "::group::${platform}"
            hardened=(docker run --rm --platform "$platform" --read-only --cap-drop ALL
                      --security-opt no-new-privileges --network vrm-tls-smoke
                      --volume "$PWD/.github/scripts:/smoke:ro" --volume "$pki:/certs:ro"
                      --entrypoint /opt/venv/bin/python)
            "${hardened[@]}" --detach --name vrm-tls-server \
              --network-alias tls.example.test --network-alias wrong.example.test \
              "$image" /smoke/tls_smoke_server.py
            status=0
            "${hardened[@]}" "$image" /smoke/tls_smoke_client.py || status=$?
            echo "Server log:"
            docker logs vrm-tls-server
            docker rm --force vrm-tls-server
            echo "::endgroup::"
            (( status == 0 )) || { echo "::error::TLS smoke test failed on ${platform}"; exit "$status"; }
          done
          docker network rm vrm-tls-smoke
      - uses: ./.github/actions/scan-image
        with:
          input: ${{ runner.temp }}/oci/view-amd64
      - uses: ./.github/actions/scan-image
        with:
          input: ${{ runner.temp }}/oci/view-arm64
      - name: Generate SBOMs
        run: |
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            arch="${platform#linux/}"
            "$RUNNER_TEMP/trivy" image --no-progress --format cyclonedx \
              --output "sbom-linux-${arch}.cdx.json" --input "$RUNNER_TEMP/oci/view-${arch}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom-linux-*.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-image
          path: ${{ runner.temp }}/image.oci.tar
          if-no-files-found: error
          retention-days: 7

  # Pushes the layout's objects by digest. No tag is created, so nothing points
  # at the image until it has been signed.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the image by digest
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      AMD64_DIGEST: ${{ needs.build.outputs.amd64-digest }}
      ARM64_DIGEST: ${{ needs.build.outputs.arm64-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-oras
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-image
          path: ${{ runner.temp }}/artifact
      - name: Unpack and check the layout
        run: |
          layout="$RUNNER_TEMP/layout"
          mkdir -p "$layout"
          tar -xf "$RUNNER_TEMP/artifact/image.oci.tar" -C "$layout"
          [[ "$(jq -r '.manifests[0].digest' "$layout/index.json")" == "$DIGEST" ]]
          for digest in "$DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            echo "${digest#sha256:}  ${layout}/blobs/sha256/${digest#sha256:}" | sha256sum --check --strict
          done
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | "$RUNNER_TEMP/oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push by digest
        run: '"$RUNNER_TEMP/oras" cp --from-oci-layout "${RUNNER_TEMP}/layout@${DIGEST}" "$REPOSITORY"'
      - name: Verify the pushed objects are the built ones
        run: |
          layout="$RUNNER_TEMP/layout"
          remote="$RUNNER_TEMP/remote"
          mkdir -p "$remote"
          for digest in "$DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            "$RUNNER_TEMP/oras" manifest fetch --output "$remote/${digest#sha256:}" "${REPOSITORY}@${digest}"
            if ! cmp "$remote/${digest#sha256:}" "$layout/blobs/sha256/${digest#sha256:}"; then
              echo "::error::${REPOSITORY}@${digest} differs from the built manifest"
              exit 1
            fi
            pushed="sha256:$(sha256sum "$remote/${digest#sha256:}" | cut -d' ' -f1)"
            [[ "$pushed" == "$digest" ]]
            echo "${REPOSITORY}@${digest}: identical to the built manifest"
          done
          for arch in amd64 arm64; do
            expected="${arch^^}_DIGEST"
            listed="$(jq -r --arg arch "$arch" '.manifests[] | select(.platform.architecture == $arch) | .digest' \
              "$remote/${DIGEST#sha256:}")"
            [[ "$listed" == "${!expected}" ]] || { echo "::error::the pushed index lists ${listed} for ${arch}"; exit 1; }
          done

  # Signs and attests the digest, then verifies both, before anything is tagged.
  sign:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write # store signatures and attestations
      id-token: write # keyless signing with the job's OIDC token
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      AMD64_DIGEST: ${{ needs.build.outputs.amd64-digest }}
      ARM64_DIGEST: ${{ needs.build.outputs.arm64-digest }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Keyless: the certificate binds the signature to this workflow at this
      # tag through the job's GitHub OIDC token. No key is stored anywhere.
      - name: Sign the image index and each platform image
        run: cosign sign --yes --recursive "${REPOSITORY}@${DIGEST}"
      - name: Attest each platform's SBOM
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom/sbom-linux-amd64.cdx.json \
            "${REPOSITORY}@${AMD64_DIGEST}"
          cosign attest --yes --type cyclonedx --predicate sbom/sbom-linux-arm64.cdx.json \
            "${REPOSITORY}@${ARM64_DIGEST}"
      - name: Verify the signatures and attestations
        run: |
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          echo "Expected signer: ${identity}"
          verify=(--certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER")
          for ref in "$DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            cosign verify "${verify[@]}" "${REPOSITORY}@${ref}" > /dev/null
            echo "Signature verified: ${REPOSITORY}@${ref}"
          done
          for ref in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            cosign verify-attestation --type cyclonedx "${verify[@]}" "${REPOSITORY}@${ref}" > /dev/null
            echo "SBOM attestation verified: ${REPOSITORY}@${ref}"
          done

  tag:
    needs: [prepare, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # apply the version tag
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-oras
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | "$RUNNER_TEMP/oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag the version
        run: |
          oras="$RUNNER_TEMP/oras"
          # A version tag is never moved to a different image. Only an explicit
          # answer counts as "no such tag": a tag list without it, or the
          # registry's NAME_UNKNOWN for a repository with no tags at all. Any
          # other error fails the job.
          errors="$RUNNER_TEMP/tags.err"
          if ! tags="$("$oras" repo tags "$REPOSITORY" 2> "$errors")"; then
            cat "$errors" >&2
            if ! grep -qi 'name unknown' "$errors"; then
              echo "::error::could not list the tags of ${REPOSITORY}"
              exit 1
            fi
            tags=""
          fi
          if grep -qxF -- "$IMAGE_TAG" <<< "$tags"; then
            existing="$("$oras" resolve "${REPOSITORY}:${IMAGE_TAG}")"
            if [[ "$existing" != "$DIGEST" ]]; then
              echo "::error::${REPOSITORY}:${IMAGE_TAG} already points to ${existing}"
              exit 1
            fi
            echo "${REPOSITORY}:${IMAGE_TAG} already points to ${DIGEST}"
          else
            "$oras" tag "${REPOSITORY}@${DIGEST}" "$IMAGE_TAG"
          fi
          resolved="$("$oras" resolve "${REPOSITORY}:${IMAGE_TAG}")"
          [[ "$resolved" == "$DIGEST" ]] || { echo "::error::${REPOSITORY}:${IMAGE_TAG} is ${resolved}"; exit 1; }
          echo "${REPOSITORY}:${IMAGE_TAG} is ${DIGEST}"

  release:
    needs: [prepare, build, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    outputs:
      promote-latest: ${{ steps.latest.outputs.promote }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image-tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DIGEST: ${{ needs.build.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: sbom
      # "latest" only ever moves forward: an older line's patch release, made
      # after a newer stable release, is published without becoming latest.
      # This release's own tag is left out, so a re-run decides the same way.
      - name: Decide whether this release becomes latest
        id: latest
        run: |
          promote=false
          if [[ "$PRERELEASE" == false ]]; then
            highest="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' |
              { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } |
              { grep -vxF -- "$TAG" || true; } |
              sed 's/^v//' | sort -V | tail -n 1)"
            echo "Highest released stable version: ${highest:-none}"
            if [[ -z "$highest" ]] ||
               [[ "$highest" != "$VERSION" && "$(printf '%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" == "$VERSION" ]]; then
              promote=true
            else
              echo "::notice::${VERSION} is not newer than ${highest}; latest is left unchanged"
            fi
          fi
          echo "Promote to latest: ${promote}"
          echo "promote=${promote}" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        run: |
          docs="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/docs/deploy-docker.md#verifying-a-release-image"
          {
            echo "VRM Alert Relay is an unofficial, independent project. It is not affiliated with, sponsored by, or endorsed by Victron Energy."
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "This is a pre-release for testing. It is not tagged \`latest\`."
              echo
            fi
            echo "## Container image"
            echo
            echo "Platforms: \`${PLATFORMS}\`"
            echo
            echo '```'
            echo "${REPOSITORY}:${IMAGE_TAG}"
            echo "${REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "The image is signed with Sigstore cosign (keyless, GitHub Actions OIDC), and each platform's CycloneDX SBOM is attached to the image as a signed attestation and to this release. To verify the signature:"
            echo
            echo '```sh'
            echo "cosign verify \\"
            echo "  --certificate-identity '${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${REPOSITORY}@${DIGEST}"
            echo '```'
            echo
            echo "Verifying the SBOM attestations is described in [docs/deploy-docker.md](${docs})."
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      # Idempotent: a re-run finishes a release that an earlier attempt left
      # as a draft or published without every asset, instead of failing.
      - name: Create or complete the GitHub Release
        env:
          PROMOTE: ${{ steps.latest.outputs.promote }}
        run: |
          prerelease=(--prerelease=false)
          [[ "$PRERELEASE" == true ]] && prerelease=(--prerelease)
          latest=(--latest=false)
          [[ "$PROMOTE" == true ]] && latest=(--latest)
          assets=(sbom/sbom-linux-amd64.cdx.json sbom/sbom-linux-arm64.cdx.json)
          existing="$RUNNER_TEMP/release.json"
          errors="$RUNNER_TEMP/release.err"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,author \
              > "$existing" 2> "$errors"; then
            echo "A release for ${TAG} exists: $(jq -c '{tagName, isDraft, author: .author.login}' "$existing")"
            if [[ "$(jq -r .tagName "$existing")" != "$TAG" || "$(jq -r .author.login "$existing")" != "github-actions[bot]" ]]; then
              echo "::error::the existing release for ${TAG} was not created by this workflow; resolve it by hand"
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${prerelease[@]}" "${latest[@]}"
          elif grep -qxF 'release not found' "$errors"; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
              "${prerelease[@]}" "${latest[@]}" "${assets[@]}"
          else
            cat "$errors" >&2
            echo "::error::could not look up the release for ${TAG}"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"Release: draft \(.isDraft), pre-release \(.isPrerelease), assets \([.assets[].name] | join(", "))"'

  latest:
    needs: [build, release]
    if: needs.release.outputs.promote-latest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # move the latest tag
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-oras
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | "$RUNNER_TEMP/oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag latest
        run: |
          oras="$RUNNER_TEMP/oras"
          "$oras" tag "${REPOSITORY}@${DIGEST}" latest
          resolved="$("$oras" resolve "${REPOSITORY}:latest")"
          [[ "$resolved" == "$DIGEST" ]] || { echo "::error::${REPOSITORY}:latest is ${resolved}"; exit 1; }
          echo "${REPOSITORY}:latest is ${DIGEST}"
