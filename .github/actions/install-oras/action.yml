name: Install oras
description: Download the oras CLI into $RUNNER_TEMP and verify its SHA-256 checksum.

runs:
  using: composite
  steps:
    - name: Install oras
      shell: bash
      env:
        ORAS_VERSION: "1.3.4"
        ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
      run: |
        archive="$RUNNER_TEMP/oras.tar.gz"
        curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
          "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
        echo "${ORAS_SHA256}  ${archive}" | sha256sum --check --strict
        tar -xzf "$archive" -C "$RUNNER_TEMP" oras
        "$RUNNER_TEMP/oras" version
