[project]
name = "vrm-alert-relay"
version = "0.1.0.dev0"
description = "Unofficial stateful alert escalation and notification relay for Victron VRM measurements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mcflycodes and contributors" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2024.2.2",
    "httpcore>=1.0,<2",
    "httpx>=0.28,<0.29",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1,<7",
]

[project.urls]
Source = "https://github.com/mcflycodes/vrm-alert-relay"

[project.scripts]
vrm-alert-relay = "vrm_alert_relay.cli:main"

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
    "trustme",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.19"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "ERA",   # eradicate
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "I",     # isort
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.flake8-type-checking]
# pydantic resolves model annotations at runtime, so their imports must not be
# moved into type-checking blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "PLR2004",
    "ANN401",   # fixtures and test doubles take arbitrary data; doubles mirror Any-typed library signatures
    "ARG",      # test doubles and parametrized lambdas must match the real signature
    "DTZ001",   # naive datetimes are deliberate test inputs (rejection cases, hypothesis bounds)
    "FBT001",   # parametrized boolean arguments are passed by name
    "PLR0913",  # fixtures and parameters are injected by name
    "PLR0917",  # same, counted as positional arguments
    "SLF001",   # tests reach into private members on purpose
    "TRY003",   # test doubles raise with ad-hoc messages
    "TRY301",   # tests raise inside try to capture real tracebacks
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--cov",
    "--cov-report=term-missing",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["vrm_alert_relay"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
